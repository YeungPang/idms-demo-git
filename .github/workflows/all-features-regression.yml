name: All Features Regression Tests (Phases 2-4+)
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"  # Daily at 2 AM UTC

env:
  IDMS_DB_HOST: localhost
  IDMS_DB_PORT: 5432
  IDMS_DB_USER: postgres
  IDMS_DB_PASSWORD: postgres
  IDMS_DB_NAME: idms_test

jobs:
  all-features-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: idms_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary apscheduler
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Run comprehensive regression suite
        run: |
          cd IDMS-Proto
          python run_all_features_regressions.py

      - name: Run tx-match queue lifecycle integration (deterministic)
        env:
          IDMS_TX_MATCH_ALLOW_TEST_FORCE_SUCCESS: "true"
        run: |
          cd IDMS-Demo
          python log/run_tx_match_queue_lifecycle_integration.py --cleanup

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: regression-test-results
          path: |
            test-results.json
            error-logs/

  enhanced-features-only:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: idms_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary apscheduler

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Run enhanced features tests only
        run: |
          cd IDMS-Proto
          python test_comprehensive_features.py
          python -m unittest test_interaction_partial_types -v

      - name: Store results
        if: always()
        run: |
          echo "Enhanced features test run completed at $(date)" >> test-run.log
