name: Phase 2 Regressions

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - ".github/workflows/phase2-regressions.yml"
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/phase2-regressions.yml"


jobs:
  phase2-regressions:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: idms_proto
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Postgresql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d idms_proto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      IDMS_DB_NAME: idms_proto
      IDMS_DB_HOST: localhost
      IDMS_DB_USER: postgres
      IDMS_DB_PASSWORD: Postgresql
      IDMS_DB_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: Run Phase 2 regressions
        working-directory: IDMS-Proto
        run: python run_phase2_regressions.py